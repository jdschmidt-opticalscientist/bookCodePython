name: Python CI (Build & Test)

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    name: Style Suggestions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: pip install ruff

      - name: Critical Logic Check
        # Fails only on broken code (F=Logic errors, E9=Syntax)
        run: ruff check . --select=F,E9

      - name: Pythonic Advice
        # Runs the full linter for your review, but never fails the build
        continue-on-error: true
        run: ruff check .

  build-and-test:
    name: Physics Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Master Simulation
        env:
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}
        run: python examples/Chapter9/master_simulation.py

      - name: Fetch private tests
        env:
          TEST_REPO: ${{ secrets.TEST_REPO }}
          TEST_REPO_PAT: ${{ secrets.TEST_REPO_PAT }}
        run: |
          git config --global --add safe.directory ${{ github.workspace }}
          if [ -n "$TEST_REPO" -a -n "$TEST_REPO_PAT" ]; then
            git clone https://$TEST_REPO_PAT@github.com/$TEST_REPO tests_private --depth=1 || echo "Private test clone failed"
          else
            echo "TEST_REPO or TEST_REPO_PAT not set; skipping private tests"
          fi

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          ARGS=""
          if [ -d tests_private ]; then
            ARGS="$ARGS tests_private"
          fi
          if [ -d tests ]; then
            ARGS="$ARGS tests"
          fi
          if [ -n "$ARGS" ]; then
            echo "Running pytest on:$ARGS"
            pytest -q $ARGS
          else
            echo "No tests found; skipping pytest"
          fi
