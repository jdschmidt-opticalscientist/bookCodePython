[project]
name = "bookCodePython"
version = "0.1.0"
description = "Python translations for Numerical Simulation of Optical Wave Propagation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Jason D. Schmidt" }
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "spyder-kernels>=3.1,<3.2",
]